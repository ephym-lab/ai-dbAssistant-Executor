name: Deploy to Azure VM

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "VM_HOST is EMPTY"
          else
            echo "VM_HOST is set"
          fi

      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/ai-dbAssistant-Executor
            git pull origin deployment

            # Ensure monitoring config directories exist
            mkdir -p monitoring/prometheus
            mkdir -p monitoring/grafana/provisioning/datasources
            mkdir -p monitoring/grafana/provisioning/dashboards
            mkdir -p monitoring/grafana/dashboards

            # Stop existing containers and remove orphans
            docker compose down --remove-orphans

            # Build and start all services (app, prometheus, grafana)
            docker compose up -d --build --force-recreate